      <div class="tool-preview-grid">${tools.map(toolCard).join('')}</div><div class="section-footnote"><span>Built for everyday work.</span><span>${tools.length.toString().padStart(2,'0')} / Tools</span></div>
    </div></section>
    <section class="closing-section shell"><span class="eyebrow">03 / ABOUT</span><div class="closing-grid"><h2>Make things.<br>Make them matter.</h2><div><p>做产品，也做设计与工具。</p>${link('关于我','#/about')}</div></div></section>
  </div>`;
}
function projectRow(p){return `<a class="project-row" href="#/work/${encodeURIComponent(p.id)}" aria-label="${esc(p.name)} 作品详情"><span class="project-num">${p.no}</span><span class="project-primary"><strong>${esc(p.name)}</strong><small>${esc(p.en)}</small></span><span class="project-type">${esc(p.meta)}</span><span class="project-year">${esc(p.year)}</span>${arrow}</a>`;}
function toolCard(t){return `<a href="#/tool/${encodeURIComponent(t.id)}" class="tool-card"><div class="tool-card-head"><span class="tool-monogram" aria-hidden="true">${t.id==='analysis'?'↗':t.id==='design-brief'?'✳':'⌁'}</span>${arrow}</div><div class="tool-card-body"><span class="tool-kicker">${esc(t.kind)}</span><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p></div><div class="tool-card-tail"><span>${esc(t.en)}</span><span>${esc(t.status)}</span></div></a>`;}
function portfolio(){return `<div class="page shell listing-page"><div class="listing-intro"><span class="eyebrow">WORK / 001 — 004</span><h1>Selected Works<span class="thin-period">.</span></h1><p>作品集</p></div><div class="list-controls"><div class="filters" role="group" aria-label="作品分类"><button data-filter="all" class="is-active">全部</button><button data-filter="product">产品</button><button data-filter="ai">独立项目</button><button data-filter="operations">运营</button><button data-filter="design">视觉与交互</button><button data-filter="architecture">建筑与空间</button></div><span class="sort-caption">Newest first ↓</span></div><div id="filtered-projects" class="project-list portfolio-list">${projects.map(projectRow).join('')}</div><div class="list-end">${sampleBadge}<span id="result-count">${projects.length.toString().padStart(2,'0')} projects</span></div></div>`;}
function toolspage(){return `<div class="page shell listing-page"><div class="listing-intro"><span class="eyebrow">UTILITY / 001</span><h1>Tools<span class="thin-period">.</span></h1><p>工具箱</p></div><div class="section-intro-line"><span>For work and everyday things.</span><span>${tools.length.toString().padStart(2,'0')} / Tools</span></div><div class="tool-page-grid">${tools.map(toolCard).join('')}</div><div class="list-end">${sampleBadge}</div></div>`;}
function about(){return `<div class="page shell about-page"><span class="eyebrow">ABOUT / YUE</span><h1>Make things.<br>Make them matter<span class="thin-period">.</span></h1><p class="about-sub">做产品，也做设计与工具。</p><div class="about-lines"><div><span>01 / Focus</span><p>Product · Design · AI</p></div><div><span>02 / Works</span><p>产品、运营、视觉与空间设计</p></div><div><span>03 / Contact</span><p>Links & contact details will be added here.</p></div></div><div class="about-end">${link('探索作品','#/portfolio')}</div></div>`;}
function workdetail(id){const p=projects.find(x=>x.id===id);if(!p)return notfound();return `<div class="page shell detail-page"><a href="#/portfolio" class="back-link">← 返回作品集</a><div class="detail-head"><span class="eyebrow">PROJECT / ${esc(p.no)}</span><h1>${esc(p.name)}<span class="thin-period">.</span></h1><p class="detail-en">${esc(p.en)}</p><div class="detail-meta"><span>${esc(p.meta)}</span><span>${esc(p.year)}</span><span>${esc(p.type)}</span></div></div><div class="detail-lead">${esc(p.summary)}</div><div class="detail-blocks">${p.blocks.map((b,i)=>`<section class="detail-block"><span class="detail-index">${String(i+1).padStart(2,'0')} / ${esc(b[0])}</span><p>${esc(b[1])}</p></section>`).join('')}</div><div class="detail-warning">${sampleBadge}<span>内容将由已审核的作品资料替换。</span></div><div class="detail-next">${link('返回全部作品','#/portfolio')}</div></div>`;}
function tooldetail(id){const t=tools.find(x=>x.id===id);if(!t)return notfound();return `<div class="page shell detail-page"><a href="#/tools" class="back-link">← 返回工具箱</a><div class="detail-head"><span class="eyebrow">TOOL / ${esc(t.kind.toUpperCase())}</span><h1>${esc(t.name)}<span class="thin-period">.</span></h1><p class="detail-en">${esc(t.en)}</p><div class="detail-meta"><span>${esc(t.kind)}</span><span>${esc(t.status)}</span></div></div><div class="detail-lead">${esc(t.desc)}</div><div class="tool-detail-actions">${t.url?`<a class="pill-primary" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">打开工具 ↗</a>`:`<span class="pill-disabled" aria-disabled="true">在线入口待开放</span>`}<a class="text-link" href="#/work/${esc(t.project)}">关联作品 <span aria-hidden="true">↗</span></a></div><div class="detail-blocks"><section class="detail-block"><span class="detail-index">01 / 当前状态</span><p>资料整理中。工具链接和可公开的体验内容将在后续补充。</p></section><section class="detail-block"><span class="detail-index">02 / 说明</span><p>私人管理功能与公开体验入口将分别设置访问权限。</p></section></div></div>`;}
function workspace(){return `<div class="page shell private-page"><div class="private-symbol" aria-hidden="true">◌</div><span class="eyebrow">PRIVATE SPACE / ACCESS RESTRICTED</span><h1>Workspace<span class="thin-period">.</span></h1><p>私人工作空间</p><div class="private-message"><div><strong>管理空间尚未开放</strong><span>OKR、Career 档案和个人文件尚未迁入，也不会随公开网站发布。</span></div><span class="private-lock" aria-hidden="true">↗</span></div><a href="#/" class="back-link">← 返回 Yue Studio</a></div>`;}
function notfound(){return `<div class="page shell missing-page"><span class="eyebrow">404 / NOT FOUND</span><h1>Not found<span class="thin-period">.</span></h1><p>这个页面暂时不存在。</p>${link('返回首页','#/')}</div>`;}
const routes={'/':home,'/portfolio':portfolio,'/tools':toolspage,'/about':about,'/workspace':workspace};
function render(){const p=path();let html=routes[p]?.();if(!html&&p.startsWith('/work/'))html=workdetail(p.slice(6));if(!html&&p.startsWith('/tool/'))html=tooldetail(p.slice(6));root.innerHTML=html||notfound();document.querySelectorAll('[data-nav]').forEach(a=>{const val=a.dataset.nav;const active=(val==='home'&&p==='/')||(val!=='home'&&p.startsWith('/'+val));a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.querySelector('#copyright-year').textContent=new Date().getFullYear();document.title=(p==='/'?'Yue Studio':(p.includes('portfolio')?'Portfolio':p.includes('tools')?'Tools':p.includes('about')?'About':p.includes('workspace')?'Workspace':projects.find(v=>p.endsWith(v.id))?.name||'Yue Studio')+' — Yue Studio');window.scrollTo({top:0,behavior:'instant'});document.querySelector('.mobile-nav').hidden=true;document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');initFilters();}
function initFilters(){const controls=root.querySelector('.filters');if(!controls)return;const list=root.querySelector('#filtered-projects');const count=root.querySelector('#result-count');controls.addEventListener('click',e=>{const btn=e.target.closest('button[data-filter]');if(!btn)return;controls.querySelectorAll('button').forEach(b=>b.classList.toggle('is-active',b===btn));const subset=btn.dataset.filter==='all'?projects:projects.filter(x=>x.key===btn.dataset.filter);list.innerHTML=subset.length?subset.map(projectRow).join(''):`<div class="empty-state">相关作品整理中。</div>`;count.textContent=subset.length.toString().padStart(2,'0')+' projects';});}
window.addEventListener('hashchange',render);
document.querySelector('.menu-toggle').addEventListener('click',()=>{const el=document.querySelector('.mobile-nav');el.hidden=!el.hidden;document.querySelector('.menu-toggle').setAttribute('aria-expanded',String(!el.hidden));});
document.querySelector('.mobile-nav').addEventListener('click',e=>{if(e.target.closest('a')){document.querySelector('.mobile-nav').hidden=true;document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');}});
render();

</script>
</body>
</html>
